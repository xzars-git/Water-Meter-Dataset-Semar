# ============================================================================
# Water Meter AI - Production Config
# Hardware: RTX 3080 Ti + Ryzen 7 9700X + 32GB DDR5
# Target: 90% resource usage | Model: YOLOv8s-obb (industry standard)
# ============================================================================

model:
  type: "yolov8s-obb"
  pretrained: true
  task: "obb"

data:
  yaml_path: "data.yaml"
  img_size: 512
  cache: true
  workers: 12

training:
  epochs: 100
  batch_size: 24
  patience: 20
  optimizer: "AdamW"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  box: 7.5
  cls: 0.5
  dfl: 1.5
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.25
  degrees: 15.0
  translate: 0.1
  scale: 0.5
  shear: 10.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

validation:
  val_interval: 1
  save_json: false
  plots: true
  conf: 0.001
  iou: 0.6

hardware:
  device: "0"
  amp: true

logging:
  project: "water-meter-ai"
  name: "exp"
  exist_ok: true
  save: true
  save_period: -1
  wandb:
    enabled: false
    project: "water-meter-detection"
    entity: null
  tensorboard:
    enabled: false

inference:
  conf_thres: 0.25
  iou_thres: 0.45
  max_det: 300
  agnostic_nms: false

export:
  format: ["tflite"]
  optimize: true
  int8: true
  dynamic: false
  simplify: true

seed: 42
verbose: true
